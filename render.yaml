# Render Blueprint for Aura — a Dockerized Flask + React web service.
#
# PRODUCTION SETUP (see LAUNCH_CHECKLIST.md for the step-by-step):
#   * DATABASE_URL  → a persistent Postgres connection string (Neon or Render
#                     Postgres). Paste it in the Render dashboard; it is never
#                     stored in this file.
#   * S3_*          → an S3-compatible bucket (Cloudflare R2 recommended) so
#                     uploaded photos and videos survive redeploys.
#
# Until DATABASE_URL is a Postgres URL the app still boots on a throwaway
# SQLite file with demo data, exactly like the old demo deploy. Nothing breaks,
# but nothing is saved between deploys either.

services:
  - type: web
    name: aura
    runtime: docker
    # "free" sleeps after 15 idle minutes (30–60s cold start). Change to
    # "starter" in the Render dashboard before launch.
    plan: free
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FLASK_APP
        value: app
      - key: FLASK_ENV
        value: production
      - key: SCHEMA
        value: abln_schema
      - key: SECRET_KEY
        generateValue: true
      # Paste your Postgres connection string in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"

      # ── uploads (Cloudflare R2 / S3) — paste in the dashboard ──
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_URL
        sync: false

      # ── launch settings — paste in the dashboard ──
      # Comma-separated emails allowed to review reports at /admin/reports
      - key: ADMIN_EMAILS
        sync: false
      # Shown on the Privacy, Terms and Support pages
      - key: SUPPORT_EMAIL
        sync: false
      # Optional: your own Tenor key for higher GIF rate limits
      # - key: TENOR_API_KEY
      #   sync: false
